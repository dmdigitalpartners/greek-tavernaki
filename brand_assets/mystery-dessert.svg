<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="1600" height="1200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- background: layered radial gradients in the site's forest palette -->
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2D6A3F"/>
      <stop offset="0.45" stop-color="#1A4A2E"/>
      <stop offset="1" stop-color="#071510"/>
    </radialGradient>
    <radialGradient id="warm" cx="50%" cy="66%" r="38%">
      <stop offset="0" stop-color="#F6C96B" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#E0A040" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E0A040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGap" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF3D1" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#F8D486" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F0B850" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A1C"/>
      <stop offset="1" stop-color="#1E140C"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0DBD0"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A2E"/>
      <stop offset="0.22" stop-color="#E9CF8C"/>
      <stop offset="0.38" stop-color="#FFF4D2"/>
      <stop offset="0.55" stop-color="#D9B56A"/>
      <stop offset="0.85" stop-color="#9C7834"/>
      <stop offset="1" stop-color="#6B4F1F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B4F1F"/>
      <stop offset="0.35" stop-color="#F3DDA0"/>
      <stop offset="1" stop-color="#6B4F1F"/>
    </linearGradient>
    <linearGradient id="sponge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D49A"/>
      <stop offset="1" stop-color="#D9AF66"/>
    </linearGradient>
    <linearGradient id="choc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3220"/>
      <stop offset="1" stop-color="#3A1E12"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
    </filter>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0-10 C1-2 2-1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2-1 -1-2 0-10Z" fill="#F8DFA0"/>
    </symbol>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- wooden table edge -->
  <path d="M0 468 Q400 440 800 468 L800 600 L0 600Z" fill="url(#table)"/>
  <path d="M0 468 Q400 440 800 468" fill="none" stroke="#5A4128" stroke-width="2" opacity="0.7"/>
  <rect width="800" height="600" fill="url(#warm)"/>

  <!-- plate shadow + plate -->
  <ellipse cx="400" cy="478" rx="262" ry="48" fill="#000" opacity="0.45" filter="url(#soft)"/>
  <ellipse cx="400" cy="458" rx="255" ry="58" fill="url(#plate)"/>
  <ellipse cx="400" cy="452" rx="196" ry="40" fill="#F0EDE6"/>
  <ellipse cx="400" cy="452" rx="196" ry="40" fill="none" stroke="#C8C2B4" stroke-width="1.5" opacity="0.8"/>

  <!-- chocolate & berry sauce drizzle on the plate -->
  <path d="M262 466 C290 456 300 476 326 468 C350 460 356 478 382 472" fill="none" stroke="#4A2616" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <circle cx="232" cy="456" r="6" fill="#C0392B"/>
  <circle cx="560" cy="470" r="5" fill="#C0392B"/>
  <circle cx="578" cy="458" r="3.5" fill="#C0392B"/>
  <!-- powdered sugar dots -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="300" cy="440" r="1.6"/><circle cx="318" cy="472" r="1.3"/><circle cx="520" cy="440" r="1.5"/>
    <circle cx="540" cy="476" r="1.2"/><circle cx="270" cy="474" r="1.2"/><circle cx="505" cy="470" r="1.4"/>
  </g>

  <!-- dessert spoon resting on the plate (right) -->
  <g transform="translate(560 470) rotate(-8) scale(0.85)">
    <rect x="0" y="-3" width="92" height="6" rx="3" fill="#D9B56A"/>
    <ellipse cx="-14" cy="0" rx="20" ry="11" fill="#E9CF8C"/>
    <ellipse cx="-16" cy="-2" rx="12" ry="5" fill="#FFF4D2" opacity="0.8"/>
  </g>

  <!-- golden light escaping from under the lifted cloche -->
  <ellipse cx="410" cy="430" rx="190" ry="46" fill="url(#glowGap)" filter="url(#blur3)"/>

  <!-- the hidden cake slice, only its front edge peeking out -->
  <g>
    <!-- slice front face: layers -->
    <path d="M318 448 L318 408 L478 396 L478 440 Q400 452 318 448Z" fill="url(#sponge)"/>
    <path d="M318 424 L478 413 L478 421 L318 432Z" fill="#C0392B"/>
    <path d="M318 412 L478 400 L478 405 L318 417Z" fill="#FAF8F3"/>
    <path d="M318 436 L478 426 L478 430 L318 440Z" fill="#FAF8F3"/>
    <path d="M314 403 L482 391 L470 380 L330 384Z" fill="#4A2616"/>
    <!-- chocolate glaze top edge -->
    <path d="M314 410 L482 397 L482 391 L314 403Z" fill="url(#choc)"/>
    <path d="M340 409 q4 9 8 0 M392 405 q4 11 8 0 M446 401 q4 8 8 0" fill="#3A1E12"/>
  </g>
  <!-- raspberries + mint peeking at the gap -->
  <g>
    <circle cx="455" cy="388" r="11" fill="#C0392B"/>
    <circle cx="451" cy="384" r="3" fill="#E35B4C"/><circle cx="459" cy="391" r="2.5" fill="#E35B4C"/><circle cx="452" cy="393" r="2.5" fill="#A93226"/>
    <circle cx="436" cy="392" r="8" fill="#B03026"/>
    <circle cx="434" cy="389" r="2.4" fill="#E35B4C"/>
    <path d="M466 382 C478 368 494 370 498 378 C488 386 476 388 466 382Z" fill="#3A8050"/>
    <path d="M466 382 L494 376" stroke="#E8F2EB" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- the cloche, lifted and tilted to the left -->
  <g transform="rotate(-9 400 380)">
    <!-- dome shadow side glow -->
    <path d="M178 372 C178 226 278 148 400 148 C522 148 622 226 622 372Z" fill="url(#dome)"/>
    <!-- highlight streak -->
    <path d="M262 330 C258 252 302 196 360 176" fill="none" stroke="#FFFBEA" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
    <path d="M250 352 C246 342 246 334 247 326" fill="none" stroke="#FFFBEA" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <!-- rim -->
    <rect x="166" y="366" width="468" height="16" rx="8" fill="url(#rim)"/>
    <!-- knob -->
    <ellipse cx="400" cy="150" rx="30" ry="8" fill="#9C7834"/>
    <path d="M384 148 C384 128 416 128 416 148Z" fill="url(#rim)"/>
    <circle cx="400" cy="124" r="14" fill="url(#dome)"/>
    <circle cx="395" cy="119" r="4" fill="#FFF4D2" opacity="0.8"/>
    <!-- engraved question mark -->
    <text x="400" y="330" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="168" fill="#0D2B1A" opacity="0.82">?</text>
    <text x="400" y="330" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="168" fill="none" stroke="#FFF4D2" stroke-width="1.5" opacity="0.45" transform="translate(-2 -2)">?</text>
  </g>

  <!-- sparkles -->
  <use href="#spark" x="128" y="150" width="26" height="26" opacity="0.85"/>
  <use href="#spark" x="640" y="118" width="34" height="34" opacity="0.95"/>
  <use href="#spark" x="682" y="210" width="16" height="16" opacity="0.7"/>
  <use href="#spark" x="96" y="280" width="14" height="14" opacity="0.6"/>
  <use href="#spark" x="560" y="372" width="18" height="18" opacity="0.9"/>
  <use href="#spark" x="222" y="388" width="14" height="14" opacity="0.8"/>

  <!-- film grain, like the rest of the site -->
  <rect width="800" height="600" filter="url(#grain)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
